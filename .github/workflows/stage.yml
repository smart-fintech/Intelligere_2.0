name:  Build Stage
on:
  push:
    branches:
    - stage

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}

    - name: npm install, build
      run: |
        : "${VITE_STORAGE_SECRET:?Add the VITE_STORAGE_SECRET_STAGE repository secret}"
        npm ci
        rm -rf .env
        echo "VITE_API_END_POINT=https://stage.api.digitaldocsys.in/" >> .env
        echo "VITE_API_TABULA_URL=https://stage.tabula.digitaldocsys.in" >> .env
        echo "VITE_API_WEBSOCKET_URL=wss://stage.api.digitaldocsys.in/" >> .env
        echo "VITE_API_WEBSOCKET_PATH=ws/tally-connector/" >> .env
        echo "VITE_GST_LOOKUP_URL=https://stage.api.digitaldocsys.in/tally/gst-details/" >> .env
        echo "VITE_GST_LOOKUP_METHOD=post" >> .env
        echo "REACT_APP_CASHFREE_ENV=sandbox" >> .env
        npm run build
      env:
        VITE_STORAGE_SECRET: ${{ secrets.VITE_STORAGE_SECRET_STAGE }}

    - name: deploy to s3
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --acl public-read --follow-symlinks --delete
      env:
        SOURCE_DIR: './dist'
        AWS_REGION: ${{ secrets.AWS_REGION_STAGE }}
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET_STAGE }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_STAGE }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGE }}

    - name: invalidate
      uses: chetan/invalidate-cloudfront-action@master
      env:
        DISTRIBUTION: ${{ secrets.CF_DISTRIBUTION_STAGE }}
        PATHS: '/*'
        AWS_REGION: ${{ secrets.AWS_REGION_STAGE }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_STAGE }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGE }}
